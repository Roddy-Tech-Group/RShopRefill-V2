<!DOCTYPE html>
<html>
<head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <form method="GET" action="?submitted=true" x-data="{ resending: false, cooldown: 0 }" @submit="if(cooldown > 0) { $event.preventDefault(); return; } resending = true">
        <button type="submit" :disabled="resending || cooldown > 0">
            <span x-show="!resending">Resend now</span>
            <span x-show="resending">Sending...</span>
        </button>
    </form>
</body>
</html>
